input {
  beats { port => 5044 }
}

filter {
  # App-Logs sind JSON (siehe app/logging_conf.py)
  if [message] =~ /^\{/ {
    json { source => "message" target => "app" skip_on_invalid_json => true }
    if [app][level]   { mutate { add_field => { "level"   => "%{[app][level]}" } } }
    if [app][service] { mutate { add_field => { "service" => "%{[app][service]}" } } }
    if [app][instance]{ mutate { add_field => { "instance" => "%{[app][instance]}" } } }
  }

  # Datenschutz-Netz: Falls doch mal Personendaten im Text landen, vor der Speicherung schwärzen
  mutate {
    gsub => [
      "message", "\b\d{2}\.\d{2}\.\d{4}\b", "[DATUM]",          # Geburtsdaten 17.05.1980
      "message", "\b\d{4}-\d{2}-\d{2}\b(?!T)", "[DATUM]",       # 1980-05-17 (nicht ISO-Zeitstempel mit T)
      "message", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[EMAIL]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "minikos-logs-%{+YYYY.MM.dd}"
  }
}
