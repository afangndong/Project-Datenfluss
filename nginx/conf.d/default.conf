# Reverse Proxy vor den App-Instanzen. Docker-DNS (127.0.0.11) wird zur Laufzeit befragt,
# deshalb startet nginx auch, wenn green/canary nicht laufen, und sieht skalierte Replikas (Rolling).
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    location / {
        proxy_pass http://$minikos_pool:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Metriken nur intern (Prometheus scrapt die Instanzen direkt)
    location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://$minikos_pool:8000; }
}
