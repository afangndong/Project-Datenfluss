# Routing nach Schweregrad: critical sofort & häufig wiederholen, warning gebündelt.
route:
  receiver: team-default
  group_by: [alertname, pool]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: team-critical
      group_wait: 10s
      repeat_interval: 1h
    - matchers: [severity="warning"]
      receiver: team-default

receivers:
  - name: team-default
    webhook_configs:
      - url: http://alert-webhook:9095/alert?prio=warning
        send_resolved: true
  - name: team-critical
    webhook_configs:
      - url: http://alert-webhook:9095/alert?prio=critical
        send_resolved: true

# Kritische Alerts unterdrücken die zugehörigen Warnungen (weniger Rauschen)
inhibit_rules:
  - source_matchers: [alertname="AppAbsent"]
    target_matchers: [severity="warning"]
    equal: []
