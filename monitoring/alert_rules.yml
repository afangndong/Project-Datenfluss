groups:
  - name: minikos-app
    rules:
      - alert: AppDown
        expr: up{job="minikos"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Mini-KOS-Instanz {{ $labels.pool }} ({{ $labels.instance }}) antwortet nicht"
          runbook: "docs/SUPPORT-SZENARIEN.md#szenario-1"

      - alert: AppAbsent
        expr: absent(up{job="minikos"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Keine einzige Mini-KOS-Instanz bekannt – Komplettausfall?"
          runbook: "docs/SUPPORT-SZENARIEN.md#szenario-1"

      - alert: HighErrorRate
        expr: |
          sum(rate(minikos_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(minikos_http_requests_total[5m])), 0.001) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Mehr als 5 % HTTP-5xx in den letzten 5 Minuten ({{ $value | humanizePercentage }})"
          runbook: "docs/SUPPORT-SZENARIEN.md#szenario-2"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(minikos_http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95-Latenz über 1 s ({{ $value | humanizeDuration }})"
          runbook: "docs/SUPPORT-SZENARIEN.md#szenario-3"

      - alert: DatabaseUnreachableFromApp
        expr: minikos_db_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Instanz {{ $labels.pool }} erreicht die Datenbank nicht"
          runbook: "docs/SUPPORT-SZENARIEN.md#szenario-4"

  - name: minikos-infra
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL ist nicht erreichbar" }

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Viele DB-Verbindungen ({{ $value }}) – Connection-Leak?" }

      - alert: ContainerMemoryHigh
        expr: |
          container_memory_working_set_bytes{name=~".+"} / (container_spec_memory_limit_bytes{name=~".+"} > 0) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Container {{ $labels.name }} nutzt >90 % seines Speicherlimits" }

      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/host",fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Weniger als 15 % freier Plattenplatz auf {{ $labels.instance }}" }

      - alert: BackupTooOld
        expr: time() - minikos_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Letztes erfolgreiches Backup ist älter als 26 Stunden"
          runbook: "docs/BETRIEB.md#backup--restore"

      - alert: BackupMetricMissing
        expr: absent(minikos_backup_last_success_timestamp_seconds)
        for: 30m
        labels: { severity: warning }
        annotations: { summary: "Es wurde noch nie ein Backup gemeldet (scripts/backup.sh laufen lassen)" }
