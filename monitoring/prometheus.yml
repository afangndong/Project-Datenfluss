global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alert_rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  # App-Instanzen per Docker-DNS: findet automatisch alle Replikas von blue/green/canary
  - job_name: minikos
    dns_sd_configs:
      - names: [app_blue, app_green, app_canary]
        type: A
        port: 8000
        refresh_interval: 10s
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: pool

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: cadvisor          # Container-CPU/RAM
    static_configs: [{ targets: ["cadvisor:8080"] }]

  - job_name: node              # Host: Disk, RAM, Backup-Textfile
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: postgres          # DB-Verbindungen, Transaktionen
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
